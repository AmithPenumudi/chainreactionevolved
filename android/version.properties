# Play requires a unique, strictly increasing versionCode for every upload — it is the only
# thing the Console uses to order releases, and a number can never be reused, even after a
# rejected or deleted upload.
#
# versionName (what players see) is NOT here: it comes from package.json, so the web build,
# the APK and the in-app version display cannot drift apart.
#
# Bump with `npm run release:bump` rather than editing by hand.
versionCode=2
